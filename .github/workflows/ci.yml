name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin to the latest stable Xcode so the Swift 6.2 toolchain required by
      # Package.swift is used, rather than whatever the runner image defaults to.
      # Actions are pinned to commit SHAs for supply-chain hardening.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Packaging only runs in the release workflow, so the icon is generated and
      # checked here to catch regressions on pull requests instead of at release.
      - name: Verify app icon
        run: |
          swift scripts/generate-app-icon.swift "$RUNNER_TEMP/AppIcon.icns"
          scripts/verify-app-icon.sh "$RUNNER_TEMP/AppIcon.icns"
